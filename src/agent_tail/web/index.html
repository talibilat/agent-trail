<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Tail</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b12;
      --panel: #111827;
      --panel-strong: #172033;
      --line: #283246;
      --text: #edf2ff;
      --muted: #98a6bf;
      --accent: #8bd3ff;
      --warn: #ffc46b;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 15% 0%, #1d2a44 0, transparent 35%), var(--bg);
      color: var(--text);
      font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--line);
      background: rgba(9, 11, 18, 0.82);
      position: sticky;
      top: 0;
      backdrop-filter: blur(12px);
    }
    h1, h2 { margin: 0; }
    h1 { font-size: 1rem; letter-spacing: 0.12em; text-transform: uppercase; }
    h2 { font-size: 0.9rem; color: var(--muted); font-weight: 600; }
    main {
      display: grid;
      grid-template-columns: minmax(220px, 320px) minmax(0, 1fr);
      gap: 1rem;
      padding: 1rem;
    }
    .panel {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: color-mix(in srgb, var(--panel) 88%, transparent);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.22);
      overflow: hidden;
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--line);
      background: var(--panel-strong);
    }
    .runs { display: grid; gap: 0.5rem; padding: 0.75rem; }
    button {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #0d1322;
      color: var(--text);
      cursor: pointer;
      padding: 0.75rem;
      text-align: left;
    }
    button[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
    .metric-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
      padding: 1rem;
    }
    .metric {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0.85rem;
      background: #0d1322;
    }
    .metric strong { display: block; font-size: 1.45rem; }
    .metric span, .muted { color: var(--muted); }
    .timeline { display: grid; gap: 0.65rem; padding: 1rem; }
    .event {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0.75rem;
      background: #0b111e;
    }
    .event-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.35rem;
    }
    code { color: var(--accent); }
    .warning { color: var(--warn); }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0.5rem 0 0;
      color: var(--muted);
      font-size: 0.78rem;
    }

    @media (max-width: 760px) {
      main { grid-template-columns: 1fr; }
      .metric-row { grid-template-columns: 1fr; }
      header { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Agent Tail</h1>
      <div class="muted">Local flight recorder</div>
    </div>
    <div id="status" class="muted">Loading runs...</div>
  </header>
  <main>
    <section class="panel" aria-labelledby="runs-heading">
      <div class="panel-head">
        <h2 id="runs-heading">Runs</h2>
        <span id="run-count" class="muted">0</span>
      </div>
      <div id="runs" class="runs"></div>
    </section>
    <section class="panel" aria-labelledby="detail-heading">
      <div class="panel-head">
        <h2 id="detail-heading">Timeline</h2>
        <span id="warning-count" class="warning"></span>
      </div>
      <div id="metrics" class="metric-row"></div>
      <div id="timeline" class="timeline"></div>
    </section>
  </main>
  <script>
    const runsEl = document.querySelector('#runs');
    const timelineEl = document.querySelector('#timeline');
    const metricsEl = document.querySelector('#metrics');
    const statusEl = document.querySelector('#status');
    const runCountEl = document.querySelector('#run-count');
    const warningCountEl = document.querySelector('#warning-count');
    let selectedTraceId = null;

    async function fetchJson(path) {
      const response = await fetch(path, { headers: { Accept: 'application/json' } });
      if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
      return response.json();
    }

    function text(value) {
      return value === null || value === undefined ? '-' : String(value);
    }

    function renderRuns(data) {
      runCountEl.textContent = data.runs.length;
      runsEl.replaceChildren(...data.runs.map((run, index) => {
        const button = document.createElement('button');
        const traceId = run.trace_id;
        if (selectedTraceId === null && index === 0) selectedTraceId = traceId;
        button.type = 'button';
        button.setAttribute('aria-current', traceId === selectedTraceId ? 'true' : 'false');
        const name = document.createElement('strong');
        name.textContent = traceId;
        const summary = document.createElement('span');
        summary.className = 'muted';
        summary.textContent = `${run.event_count} events, ${run.actor_count} actors`;
        button.append(name, document.createElement('br'), summary);
        button.addEventListener('click', () => selectRun(traceId));
        return button;
      }));
      if (data.ingestion_errors.length) {
        statusEl.textContent = `${data.ingestion_errors.length} ingestion issue(s)`;
        statusEl.className = 'warning';
      } else {
        statusEl.textContent = 'Snapshot loaded';
        statusEl.className = 'muted';
      }
    }

    async function selectRun(traceId) {
      selectedTraceId = traceId;
      const runs = await fetchJson('/api/v1/runs');
      renderRuns(runs);
      const detail = await fetchJson(`/api/v1/runs/${encodeURIComponent(traceId)}`);
      renderDetail(detail);
    }

    function renderDetail(detail) {
      const run = detail.run;
      warningCountEl.textContent = detail.warnings.length ? `${detail.warnings.length} warning(s)` : '';
      metricsEl.replaceChildren(
        metric('Events', run.event_count),
        metric('Actors', run.actor_count),
        metric('Warnings', run.warning_count)
      );
      timelineEl.replaceChildren(...detail.events.map((event) => {
        const node = document.createElement('article');
        node.className = 'event';
        const top = document.createElement('div');
        top.className = 'event-top';
        const kind = document.createElement('strong');
        kind.textContent = event.kind;
        const eventId = document.createElement('code');
        eventId.textContent = event.event_id;
        top.append(kind, eventId);

        const meta = document.createElement('div');
        meta.className = 'muted';
        meta.append(
          `${event.timestamp} · actor `,
          code(text(event.actor.id)),
          ' · span ',
          code(event.span_id)
        );

        const operation = document.createElement('div');
        operation.textContent = `${text(event.operation.name)} · ${text(event.operation.status)}${event.uncertain ? ' · uncertain order' : ''}`;
        node.append(top, meta, operation);
        if (event.payload) {
          const payload = document.createElement('pre');
          payload.textContent = JSON.stringify(event.payload.preview, null, 2);
          node.append(payload);
        }
        return node;
      }));
      if (!detail.events.length) {
        timelineEl.textContent = 'No events accepted for this run.';
      }
    }

    function metric(label, value) {
      const node = document.createElement('div');
      node.className = 'metric';
      const number = document.createElement('strong');
      number.textContent = value;
      const caption = document.createElement('span');
      caption.textContent = label;
      node.append(number, caption);
      return node;
    }

    function code(value) {
      const node = document.createElement('code');
      node.textContent = value;
      return node;
    }

    async function init() {
      try {
        const data = await fetchJson('/api/v1/runs');
        renderRuns(data);
        if (selectedTraceId) await selectRun(selectedTraceId);
        else statusEl.textContent = 'No accepted runs';
      } catch (error) {
        statusEl.textContent = `Failed to load: ${error.message}`;
        statusEl.className = 'warning';
      }
    }

    init();
  </script>
</body>
</html>
