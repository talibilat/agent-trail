<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Tail</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b12;
      --panel: #111827;
      --panel-strong: #172033;
      --line: #283246;
      --text: #edf2ff;
      --muted: #98a6bf;
      --accent: #8bd3ff;
      --warn: #ffc46b;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 15% 0%, #1d2a44 0, transparent 35%), var(--bg);
      color: var(--text);
      font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body.light-mode { filter: invert(.88) hue-rotate(180deg); }
    body.light-mode img, body.light-mode svg { filter: invert(1) hue-rotate(180deg); }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--line);
      background: rgba(9, 11, 18, 0.82);
      position: sticky;
      top: 0;
      backdrop-filter: blur(12px);
    }
    h1, h2 { margin: 0; }
    h1 { font-size: 1rem; letter-spacing: 0.12em; text-transform: uppercase; }
    h2 { font-size: 0.9rem; color: var(--muted); font-weight: 600; }
    main {
      display: grid;
      grid-template-columns: minmax(220px, 320px) minmax(0, 1fr);
      gap: 1rem;
      padding: 1rem;
    }
    .panel {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: color-mix(in srgb, var(--panel) 88%, transparent);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.22);
      overflow: hidden;
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--line);
      background: var(--panel-strong);
    }
    .runs { display: grid; gap: 0.5rem; padding: 0.75rem; }
    button {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #0d1322;
      color: var(--text);
      cursor: pointer;
      padding: 0.75rem;
      text-align: left;
    }
    button[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
    .metric-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
      padding: 1rem;
    }
    .metric {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0.85rem;
      background: #0d1322;
    }
    .metric strong { display: block; font-size: 1.45rem; }
    .metric span, .muted { color: var(--muted); }
    .view-tabs, .view-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 0 1rem 1rem;
    }
    .view-tabs button, .view-toolbar button {
      width: auto;
      padding: 0.5rem 0.7rem;
    }
    .view-stage {
      min-height: 420px;
      margin: 0 1rem 1rem;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(139, 211, 255, 0.08), rgba(13, 19, 34, 0.92));
      overflow: hidden;
      position: relative;
    }
    .view-canvas {
      position: relative;
      width: 1200px;
      min-height: 700px;
      transform-origin: 0 0;
    }
    .edge-layer {
      inset: 0;
      overflow: visible;
      position: absolute;
      width: 1200px;
      height: 700px;
    }
    .agent-card {
      position: absolute;
      width: 160px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(13, 19, 34, 0.96);
      padding: 0.75rem;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.28);
    }
    .agent-card[aria-current="true"] {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent) inset, 0 12px 34px rgba(139, 211, 255, 0.18);
    }
    .agent-card .agent-id { display: block; font-weight: 700; }
    .agent-card .agent-meta { color: var(--muted); font-size: 0.78rem; }
    .selection {
      padding: 0 1rem 1rem;
      color: var(--muted);
    }
    .dense-note {
      position: absolute;
      right: 1rem;
      top: 1rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.35rem 0.6rem;
      background: rgba(9, 11, 18, 0.82);
      color: var(--warn);
    }
    .playback {
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      align-items: center;
      gap: 0.75rem;
      padding: 0 1rem 1rem;
    }
    .playback button, .playback select { width: auto; padding: 0.5rem 0.7rem; }
    .playback input { width: 100%; accent-color: var(--accent); }
    .filters {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.5rem;
      padding: 0 1rem 1rem;
    }
    .filters input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #0d1322;
      color: var(--text);
      padding: 0.55rem;
    }
    .inspector, .warnings-drawer {
      margin: 0 1rem 1rem;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(13, 19, 34, 0.92);
      padding: 1rem;
    }
    .inspector dl { display: grid; grid-template-columns: 140px 1fr; gap: 0.35rem 0.75rem; margin: 0; }
    .inspector dt { color: var(--muted); }
    .inspector dd { margin: 0; word-break: break-word; }
    .warnings-drawer[hidden] { display: none; }
    .drawer-item { border-top: 1px solid var(--line); padding: 0.6rem 0; }
    .swimlane, .sequence-view { display: grid; gap: 0.75rem; padding: 1rem; }
    .lane, .sequence-row {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(13, 19, 34, 0.88);
      padding: 0.75rem;
    }
    .lane-track {
      position: relative;
      height: 26px;
      margin-top: 0.5rem;
      border-radius: 999px;
      background: #080d18;
      overflow: hidden;
    }
    .lane-event {
      position: absolute;
      top: 5px;
      width: 16px;
      height: 16px;
      border-radius: 999px;
      background: var(--accent);
      border: 2px solid #0d1322;
    }
    .sequence-row strong { color: var(--accent); }
    .timeline { display: grid; gap: 0.65rem; padding: 1rem; }
    .findings { display: grid; gap: 0.5rem; padding: 0 1rem 1rem; }
    .finding {
      border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--line));
      border-radius: 12px;
      padding: 0.65rem;
      background: rgba(255, 196, 107, 0.08);
      color: var(--warn);
    }
    .event {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0.75rem;
      background: #0b111e;
    }
    .event-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.35rem;
    }
    code { color: var(--accent); }
    .warning { color: var(--warn); }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0.5rem 0 0;
      color: var(--muted);
      font-size: 0.78rem;
    }

    /* Flight recorder composition from the supplied orchestration design. */
    html, body { height: 100%; overflow: hidden; }
    body {
      min-height: 100%;
      background: #080b12;
      font-family: "IBM Plex Sans", "SF Pro Text", system-ui, sans-serif;
    }
    button, input, select { font: inherit; }
    header.topbar {
      position: relative;
      z-index: 30;
      height: 52px;
      padding: 0 16px;
      border-bottom: 1px solid #1e2940;
      background: #111725;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 14px;
      backdrop-filter: none;
    }
    .brand { display: flex; align-items: center; gap: 9px; flex: none; }
    .brand-mark {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #b18cff, #33c9ff);
      color: #080b12;
      font: 700 10px "IBM Plex Mono", ui-monospace, monospace;
    }
    .brand-name { font-size: 14px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase; }
    .brand-badge {
      border: 1px solid #1e2940;
      border-radius: 4px;
      padding: 2px 6px;
      color: #5a6883;
      font: 500 9px "IBM Plex Mono", ui-monospace, monospace;
      letter-spacing: .5px;
    }
    .top-divider { width: 1px; height: 24px; background: #1e2940; }
    .run-picker { position: relative; width: min(310px, 28vw); }
    .run-picker-label { color: #5a6883; font: 600 8px "IBM Plex Mono", monospace; letter-spacing: 1px; }
    .runs { position: relative; display: block; padding: 0; }
    .runs button {
      display: block;
      width: 100%;
      padding: 5px 10px;
      border-color: #1e2940;
      border-radius: 7px;
      background: #0d1320;
      line-height: 1.2;
    }
    .runs button strong { font-size: 11px; }
    .runs button .muted { font: 400 9px "IBM Plex Mono", monospace; }
    .run-menu { position: absolute; top: 40px; left: 0; z-index: 60; width: 300px; max-height: min(420px,calc(100vh - 70px)); overflow-y: auto; padding: 6px; border: 1px solid #1e2940; border-radius: 9px; background: #111725; box-shadow: 0 18px 40px rgba(0,0,0,.5); }
    .run-menu[hidden] { display: none; }
    .run-menu button { margin-bottom: 4px; }
    .run-count { color: #5a6883; font: 500 9px "IBM Plex Mono", monospace; }
    .top-spacer { flex: 1; }
    .top-search {
      width: 220px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 10px;
      border: 1px solid #1e2940;
      border-radius: 7px;
      background: #0d1320;
    }
    .top-search span { color: #5a6883; }
    .top-search input {
      min-width: 0;
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: #e6edf7;
      font: 400 11px "IBM Plex Mono", monospace;
    }
    .warning-button, .theme-button {
      width: auto;
      padding: 7px 10px;
      border-color: #1e2940;
      border-radius: 7px;
      background: #0d1320;
      font-size: 11px;
      white-space: nowrap;
    }
    .warning-button { color: #ffb454; }
    .warning-button::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 7px; border-radius: 50%; background: #ffb454; }
    .theme-button { width: 34px; color: #8896ad; text-align: center; }
    .source-status { color: #ffb454; font: 600 10px "IBM Plex Mono", monospace; white-space: nowrap; }
    .metric-row {
      height: 74px;
      padding: 0;
      display: flex;
      gap: 0;
      overflow-x: auto;
      border-bottom: 1px solid #1e2940;
      background: #0d1320;
    }
    .metric {
      min-width: 155px;
      flex: 1 0 155px;
      border: 0;
      border-right: 1px solid #1e2940;
      border-radius: 0;
      padding: 13px 16px 10px;
      background: transparent;
    }
    .metric strong { color: #33c9ff; font: 600 20px "IBM Plex Mono", monospace; line-height: 1.1; }
    .metric:nth-child(2) strong { color: #37e39b; }
    .metric:nth-child(3) strong { color: #b18cff; }
    .metric:nth-child(4) strong { color: #ffb454; }
    .metric span { display: block; margin-top: 4px; color: #5a6883; font: 500 9px "IBM Plex Mono", monospace; letter-spacing: .8px; text-transform: uppercase; }
    main.workspace {
      height: calc(100vh - 126px);
      min-height: 0;
      padding: 0;
      display: flex;
      gap: 0;
    }
    .stage-shell {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #080b12;
      overflow: hidden;
    }
    .stage-head {
      height: 48px;
      flex: none;
      padding: 8px 14px;
      border-bottom: 1px solid #1e2940;
      background: #111725;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .view-tabs { display: flex; gap: 4px; padding: 0; flex-wrap: nowrap; }
    .view-tabs button {
      width: auto;
      padding: 6px 10px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: #8896ad;
      font-size: 11px;
    }
    .view-tabs button[aria-current="true"] { border-color: #7aa2ff; background: rgba(122,162,255,.12); color: #a7c0ff; box-shadow: none; }
    .stage-head-spacer { flex: 1; }
    .filters { display: flex; gap: 5px; padding: 0; width: min(360px, 35vw); }
    .filters input {
      min-width: 0;
      height: 30px;
      padding: 5px 8px;
      border-color: #1e2940;
      border-radius: 6px;
      background: #0d1320;
      font: 400 9px "IBM Plex Mono", monospace;
    }
    .view-toolbar { display: flex; gap: 4px; padding: 0; flex-wrap: nowrap; }
    .view-toolbar button { width: auto; padding: 6px 8px; border-radius: 6px; border-color: #1e2940; background: #0d1320; color: #8896ad; font-size: 10px; }
    .view-toolbar button[data-action^="pan-"] { display: none; }
    .stage-content { position: relative; min-height: 0; flex: 1; overflow: hidden; }
    .view-stage {
      position: absolute;
      inset: 0;
      min-height: 0;
      margin: 0;
      border: 0;
      border-radius: 0;
      overflow: hidden;
      background-color: #080b12;
      background-image: radial-gradient(circle at 1px 1px, #141c2e 1px, transparent 0);
      background-size: 26px 26px;
    }
    .view-canvas { min-height: 100%; }
    .agent-card {
      width: 132px;
      min-height: 50px;
      padding: 6px 8px 6px 44px;
      border-color: transparent;
      border-radius: 8px;
      background: rgba(13,19,32,.72);
      box-shadow: none;
      overflow: visible;
    }
    .agent-card::before {
      content: "";
      position: absolute;
      left: 7px;
      top: 8px;
      width: 28px;
      height: 28px;
      border: 2px solid #33c9ff;
      border-radius: 50%;
      background: #111725;
      box-shadow: 0 0 0 4px rgba(51,201,255,.08), 0 0 14px rgba(51,201,255,.18);
    }
    .agent-card.status-waiting::before { border-color: #ffb454; box-shadow: 0 0 0 4px rgba(255,180,84,.08), 0 0 14px rgba(255,180,84,.18); }
    .agent-card.status-done::before { border-color: #37e39b; box-shadow: 0 0 0 4px rgba(55,227,155,.08), 0 0 14px rgba(55,227,155,.18); }
    .agent-card.status-failed::before { border-color: #ff5d6c; box-shadow: 0 0 0 4px rgba(255,93,108,.08), 0 0 14px rgba(255,93,108,.18); }
    .agent-card.status-stalled::before { border-color: #ffb454; animation: node-pulse 1.6s ease infinite; }
    .agent-card.role-orchestrator::before { border-color: #b18cff; box-shadow: 0 0 0 4px rgba(177,140,255,.1), 0 0 14px rgba(177,140,255,.22); }
    @keyframes node-pulse { 50% { box-shadow: 0 0 0 8px rgba(255,180,84,0); } }
    .agent-card[aria-current="true"] { border-color: #7aa2ff; background: rgba(122,162,255,.12); box-shadow: none; }
    .agent-card .agent-id { font: 600 10px "IBM Plex Sans", sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .agent-card .agent-meta { display: block; font: 400 8px "IBM Plex Mono", monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .selection, .findings { display: none; }
    .timeline { position: absolute; inset: 0; margin: 0; padding: 14px; overflow: auto; background: #080b12; }
    .timeline[hidden], .view-stage[hidden] { display: none !important; }
    .event { border-color: #1e2940; border-radius: 8px; background: #0d1320; }
    .swimlane, .sequence-view { position: absolute; inset: 0; overflow: auto; padding: 18px; background: #080b12; }
    .lane, .sequence-row { border-color: #1e2940; border-radius: 8px; background: #0d1320; }
    .transport {
      height: 60px;
      flex: none;
      padding: 0 16px;
      border-top: 1px solid #1e2940;
      background: #111725;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .transport-clock { width: 112px; text-align: center; }
    .transport-clock strong { display: block; color: #e6edf7; font: 600 12px "IBM Plex Mono", monospace; }
    .transport-clock span { display: block; margin-top: 2px; color: #5a6883; font: 400 8px "IBM Plex Mono", monospace; text-transform: uppercase; }
    .playback { display: contents; }
    .playback button, .playback select { width: auto; padding: 6px 9px; border-color: #1e2940; border-radius: 7px; background: #0d1320; font-size: 10px; }
    #playback-toggle { width: 38px; height: 38px; padding: 0; border-radius: 9px; background: #33c9ff; color: #080b12; text-align: center; font-weight: 700; }
    #scrubber { flex: 1; accent-color: #33c9ff; }
    #speed { color: #e6edf7; }
    #jump-live { color: #8896ad; }
    .inspector-shell {
      width: 376px;
      flex: none;
      overflow: auto;
      border-left: 1px solid #1e2940;
      background: #111725;
    }
    .inspector {
      min-height: 100%;
      margin: 0;
      padding: 16px;
      border: 0;
      border-radius: 0;
      background: transparent;
    }
    .inspector h2 { padding-bottom: 12px; border-bottom: 1px solid #1e2940; color: #e6edf7; font-size: 14px; }
    .inspector-header { display: flex; align-items: center; gap: 10px; padding-bottom: 14px; border-bottom: 1px solid #1e2940; }
    .inspector-avatar { width: 34px; height: 34px; flex: none; display: grid; place-items: center; border: 2px solid #33c9ff; border-radius: 50%; color: #33c9ff; font: 700 11px "IBM Plex Mono", monospace; }
    .inspector-title { flex: 1; min-width: 0; }
    .inspector-title strong { display: block; font-size: 14px; }
    .inspector-title span { color: #8896ad; font: 400 9px "IBM Plex Mono", monospace; }
    .status-pill { padding: 3px 7px; border: 1px solid #37e39b; border-radius: 999px; color: #37e39b; font: 600 9px "IBM Plex Mono", monospace; }
    .inspector-block { padding: 14px 0; border-bottom: 1px solid #1e2940; }
    .inspector-block:last-child { border-bottom: 0; }
    .inspector-label { margin-bottom: 9px; color: #5a6883; font: 600 9px "IBM Plex Mono", monospace; letter-spacing: 1px; }
    .usage-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 7px; }
    .usage-card { padding: 8px; border: 1px solid #1e2940; border-radius: 8px; background: #0d1320; }
    .usage-card span { display: block; color: #8896ad; font: 400 8px "IBM Plex Mono", monospace; }
    .usage-card strong { display: block; margin-top: 3px; color: #33c9ff; font: 600 14px "IBM Plex Mono", monospace; }
    .relationship-row, .inspector-event { display: flex; align-items: center; gap: 8px; margin-top: 7px; color: #8896ad; font: 400 10px "IBM Plex Mono", monospace; }
    .relationship-row button, .inspector-event { width: auto; padding: 4px 7px; border-color: #1e2940; border-radius: 6px; background: #0d1320; color: #e6edf7; }
    .inspector dl { grid-template-columns: 106px 1fr; gap: 8px 10px; font: 400 10px "IBM Plex Mono", monospace; }
    .inspector dt { color: #5a6883; }
    .inspector dd { color: #e6edf7; }
    .warnings-drawer {
      position: fixed;
      z-index: 80;
      top: 0;
      right: 0;
      bottom: 0;
      width: 420px;
      margin: 0;
      overflow: auto;
      border: 0;
      border-left: 1px solid #1e2940;
      border-radius: 0;
      background: #111725;
      box-shadow: -20px 0 50px rgba(0,0,0,.5);
    }
    .warnings-backdrop { position: fixed; z-index: 79; inset: 0; background: rgba(0,0,0,.5); }
    .warnings-backdrop[hidden] { display: none; }
    .drawer-item { display: block; width: 100%; margin-bottom: 8px; padding: 10px; border: 1px solid #1e2940; border-radius: 8px; background: #0d1320; font-size: 11px; color: #8896ad; text-align: left; }
    .drawer-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; margin: -1rem -1rem 1rem; padding: 14px 16px; border-bottom: 1px solid #1e2940; background: #111725; }
    .drawer-head h2 { flex: 1; margin: 0; color: #e6edf7; font-size: 14px; }
    .drawer-head button { width: auto; padding: 5px 10px; border-color: #1e2940; background: #0d1320; color: #8896ad; }
    @media (max-width: 980px) {
      .brand-badge, .top-divider, .run-count, .theme-button { display: none; }
      .run-picker { width: 220px; }
      .top-search { width: 180px; }
      .inspector-shell { width: 300px; }
      .stage-head { flex-wrap: wrap; height: auto; }
      .filters { order: 3; width: 100%; }
    }
    @media (max-width: 720px) {
      html, body { overflow: auto; }
      header.topbar { height: auto; min-height: 52px; flex-wrap: wrap; padding: 8px; }
      .run-picker { order: 3; width: 100%; }
      .top-search { display: none; }
      .metric-row { height: 68px; }
      main.workspace { height: auto; min-height: calc(100vh - 120px); display: block; }
      .stage-shell { min-height: 620px; }
      .stage-head { height: auto; flex-wrap: wrap; }
      .view-tabs { overflow-x: auto; width: 100%; }
      .filters { display: flex; }
      .view-toolbar { display: flex; }
      .view-toolbar button { display: none; }
      .view-toolbar button[data-action="show-more"], .view-toolbar button[data-action="reset"], .view-toolbar button[data-action="focus"] { display: block; }
      .inspector-shell { display: block; width: 100%; min-height: 320px; max-height: none; overflow: visible; border-left: 0; border-top: 1px solid #1e2940; background: #111725; }
      .inspector { min-height: 320px; }
      .transport { min-height: 60px; height: auto; padding: 8px; flex-wrap: wrap; }
      .transport-clock { width: 100px; }
      #scrubber { min-width: 110px; }
      #jump-live { margin-left: auto; }
      .warnings-drawer { width: min(420px,100vw); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">AT</span>
      <span class="brand-name">Agent Tail</span>
      <span class="brand-badge">FLIGHT&nbsp;RECORDER</span>
    </div>
    <span class="top-divider"></span>
    <div class="run-picker">
      <span class="run-picker-label">CURRENT TRACE</span>
      <div id="runs" class="runs"></div>
    </div>
    <span id="run-count" class="run-count">0 traces</span>
    <div class="top-spacer"></div>
    <label class="top-search"><span>⌕</span><input id="search" type="search" placeholder="filter agents, kinds, traces…"></label>
    <button type="button" class="warning-button" data-action="warnings" aria-label="Warnings"><span id="warning-count">0 warnings</span></button>
    <button type="button" class="theme-button" aria-label="Theme">☼</button>
    <div id="status" class="source-status">Loading runs...</div>
  </header>
  <div id="metrics" class="metric-row"></div>
  <main class="workspace">
    <section class="stage-shell" aria-label="Orchestration visualization">
      <div class="stage-head">
        <div class="view-tabs" aria-label="Run views">
          <button type="button" data-view="graph" aria-label="Graph">◉ Graph</button>
          <button type="button" data-view="tree" aria-label="Tree">├ Tree</button>
          <button type="button" data-view="swimlane" aria-label="Swimlane">▦ Swimlane</button>
          <button type="button" data-view="sequence" aria-label="Sequence">⇄ Sequence</button>
          <button type="button" data-view="timeline" aria-label="Timeline">≡ Timeline</button>
        </div>
        <div class="stage-head-spacer"></div>
        <div class="filters" aria-label="Filters">
          <input id="actor-filter" type="search" placeholder="agent">
          <input id="kind-filter" type="search" placeholder="kind">
        </div>
        <div class="view-toolbar" aria-label="View controls">
          <button type="button" data-action="zoom-in">Zoom in</button>
          <button type="button" data-action="zoom-out">Zoom out</button>
          <button type="button" data-action="pan-left">Pan left</button>
          <button type="button" data-action="pan-right">Pan right</button>
          <button type="button" data-action="pan-up">Pan up</button>
          <button type="button" data-action="pan-down">Pan down</button>
          <button type="button" data-action="focus">◎ Focus</button>
          <button type="button" data-action="show-more" aria-label="Show more">More</button>
          <button type="button" data-action="reset">Reset</button>
        </div>
      </div>
      <div class="stage-content">
        <div id="selection" class="selection"></div>
        <div id="stage" class="view-stage"></div>
        <div id="findings" class="findings"></div>
        <div id="timeline" class="timeline"></div>
      </div>
      <div class="transport">
        <div class="playback" aria-label="Playback controls">
          <button type="button" id="playback-toggle">▶</button>
          <div class="transport-clock"><strong id="playback-clock">00:00 / 00:00</strong><span id="playback-mode">streaming</span></div>
          <input id="scrubber" type="range" min="0" max="0" step="0.1" value="0">
          <select id="speed" aria-label="Playback speed">
            <option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option>
          </select>
          <button type="button" id="jump-live" aria-label="Jump to live">● LIVE</button>
        </div>
      </div>
    </section>
    <aside class="inspector-shell">
      <section id="inspector" class="inspector" aria-label="Inspector"></section>
    </aside>
    <div id="warnings-backdrop" class="warnings-backdrop" hidden></div>
    <section id="warnings-drawer" class="warnings-drawer" hidden role="dialog" aria-modal="true" aria-label="Warnings drawer"></section>
  </main>
  <script>
    const runsEl = document.querySelector('#runs');
    const timelineEl = document.querySelector('#timeline');
    const metricsEl = document.querySelector('#metrics');
    const findingsEl = document.querySelector('#findings');
    const stageEl = document.querySelector('#stage');
    const selectionEl = document.querySelector('#selection');
    const statusEl = document.querySelector('#status');
    const runCountEl = document.querySelector('#run-count');
    const warningCountEl = document.querySelector('#warning-count');
    const playbackToggleEl = document.querySelector('#playback-toggle');
    const playbackClockEl = document.querySelector('#playback-clock');
    const playbackModeEl = document.querySelector('#playback-mode');
    const scrubberEl = document.querySelector('#scrubber');
    const speedEl = document.querySelector('#speed');
    const jumpLiveEl = document.querySelector('#jump-live');
    const searchEl = document.querySelector('#search');
    const actorFilterEl = document.querySelector('#actor-filter');
    const kindFilterEl = document.querySelector('#kind-filter');
    const inspectorEl = document.querySelector('#inspector');
    const warningsDrawerEl = document.querySelector('#warnings-drawer');
    const warningsBackdropEl = document.querySelector('#warnings-backdrop');
    const themeButtonEl = document.querySelector('.theme-button');
    const viewButtons = [...document.querySelectorAll('[data-view]')];
    const actionButtons = [...document.querySelectorAll('[data-action]')];
    const svgNamespace = `http${'://'}www.w3.org/2000/svg`;
    let selectedTraceId = null;
    let selectedView = 'graph';
    let selectedAgentId = null;
    let selectedEventId = null;
    let focusedAgentId = null;
    let warningsOpen = false;
    let visibleLimit = initialVisibleLimit();
    let currentDetail = null;
    let viewTransform = { scale: 1, x: 0, y: 0 };
    let playbackTraceId = null;
    let playbackTime = null;
    let liveFollow = true;
    let playing = false;
    let playbackTimer = null;
    let playbackSpeed = 1;
    let cursor = 0;
    let events = null;
    let runMenuOpen = false;
    let dragPoint = null;
    const accessToken = new URLSearchParams(window.location.search).get('token');

    viewButtons.forEach((button) => button.addEventListener('click', () => {
      selectedView = button.dataset.view;
      renderDetail(currentDetail);
    }));

    actionButtons.forEach((button) => button.addEventListener('click', () => {
      handleViewAction(button.dataset.action);
    }));
    playbackToggleEl.addEventListener('click', () => setPlaying(!playing));
    scrubberEl.addEventListener('input', () => {
      playbackTime = Number(scrubberEl.value);
      liveFollow = false;
      setPlaying(false);
      renderDetail(currentDetail);
    });
    speedEl.addEventListener('change', () => {
      playbackSpeed = Number(speedEl.value);
      if (playing) startPlaybackTimer();
    });
    jumpLiveEl.addEventListener('click', () => {
      liveFollow = true;
      playbackTime = durationOf(currentDetail);
      setPlaying(false);
      renderDetail(currentDetail);
    });
    [searchEl, actorFilterEl, kindFilterEl].forEach((input) => {
      input.addEventListener('input', () => renderDetail(currentDetail));
    });
    warningsBackdropEl.addEventListener('click', () => {
      warningsOpen = false;
      renderDetail(currentDetail);
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && warningsOpen) {
        warningsOpen = false;
        renderDetail(currentDetail);
      }
    });
    themeButtonEl.addEventListener('click', () => {
      document.body.classList.toggle('light-mode');
      themeButtonEl.textContent = document.body.classList.contains('light-mode') ? '◐' : '☼';
    });
    stageEl.addEventListener('wheel', (event) => {
      if (!['graph', 'tree'].includes(selectedView)) return;
      event.preventDefault();
      viewTransform.scale = Math.min(2.5, Math.max(0.45, viewTransform.scale - event.deltaY * 0.001));
      renderDetail(currentDetail);
    }, { passive: false });
    stageEl.addEventListener('pointerdown', (event) => {
      if (event.target.closest('button')) return;
      dragPoint = { x: event.clientX, y: event.clientY };
      stageEl.setPointerCapture(event.pointerId);
    });
    stageEl.addEventListener('pointermove', (event) => {
      if (!dragPoint) return;
      viewTransform.x += event.clientX - dragPoint.x;
      viewTransform.y += event.clientY - dragPoint.y;
      dragPoint = { x: event.clientX, y: event.clientY };
      renderDetail(currentDetail);
    });
    stageEl.addEventListener('pointerup', () => { dragPoint = null; });
    stageEl.addEventListener('pointercancel', () => { dragPoint = null; });

    async function fetchJson(path) {
      const response = await fetch(apiPath(path), { headers: { Accept: 'application/json' } });
      if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
      return response.json();
    }

    function text(value) {
      return value === null || value === undefined ? '-' : String(value);
    }

    function renderRuns(data) {
      cursor = data.cursor;
      runCountEl.textContent = `${data.runs.length} trace${data.runs.length === 1 ? '' : 's'}`;
      if (selectedTraceId === null && data.runs.length) selectedTraceId = data.runs[0].trace_id;
      const current = data.runs.find((run) => run.trace_id === selectedTraceId) || data.runs[0];
      if (!current) {
        runsEl.replaceChildren();
        return;
      }
      const selected = runButton(current, true);
      selected.addEventListener('click', () => {
        runMenuOpen = !runMenuOpen;
        renderRuns(data);
      });
      const menu = document.createElement('div');
      menu.className = 'run-menu';
      menu.hidden = !runMenuOpen;
      menu.append(...data.runs.map((run) => {
        const button = runButton(run, run.trace_id === selectedTraceId);
        button.addEventListener('click', () => {
          runMenuOpen = false;
          selectRun(run.trace_id);
        });
        return button;
      }));
      runsEl.replaceChildren(selected, menu);
      if (data.findings.length) {
        statusEl.textContent = `${data.source.state} · ${data.findings.length} finding(s)`;
        statusEl.className = 'source-status warning';
      } else {
        const connection = data.source.connected ? 'connected' : 'disconnected';
        statusEl.textContent = `${data.source.kind} ${connection} · ${data.source.state}`;
        statusEl.className = 'source-status muted';
      }
    }

    function runButton(run, active) {
        const button = document.createElement('button');
        const traceId = run.trace_id;
        button.type = 'button';
        button.setAttribute('aria-current', active ? 'true' : 'false');
        const name = document.createElement('strong');
        name.textContent = traceId;
        const summary = document.createElement('span');
        summary.className = 'muted';
        summary.textContent = `${run.state} · ${run.event_count} events, ${run.actor_count} actors`;
        button.append(name, document.createElement('br'), summary);
        return button;
    }

    async function selectRun(traceId) {
      selectedTraceId = traceId;
      selectedAgentId = null;
      selectedEventId = null;
      focusedAgentId = null;
      viewTransform = { scale: 1, x: 0, y: 0 };
      const runs = await fetchJson('/api/v1/runs');
      renderRuns(runs);
      const detail = await fetchJson(`/api/v1/runs/${encodeURIComponent(traceId)}`);
      renderDetail(detail);
    }

    function renderDetail(detail) {
      if (!detail) return;
      currentDetail = detail;
      cursor = Math.max(cursor, detail.cursor);
      const run = detail.run;
      syncPlayback(detail);
      const visibleEvents = eventsAtHorizon(detail);
      const filteredEvents = filterEvents(visibleEvents);
      const visibleAgents = filteredAgentsAtHorizon(detail);
      const visibleWarnings = detail.warnings.filter((warning) => !warning.event_id || visibleEvents.some((event) => event.event_id === warning.event_id));
      const visibleFindings = detail.findings.filter((finding) => !finding.event_id || visibleEvents.some((event) => event.event_id === finding.event_id));
      warningCountEl.textContent = visibleWarnings.length ? `${visibleWarnings.length} warning(s)` : '';
      const usage = usageFor(filteredEvents);
      const requestCount = filteredEvents.filter(isRequestStart).length;
      const elapsed = Math.max(playbackTime || 0, 0);
      const throughput = elapsed > 0 ? requestCount / elapsed : 0;
      metricsEl.replaceChildren(
        metric('Agents', `${visibleAgents.length}/${run.actor_count}`),
        metric('Requests', requestCount),
        metric('Tokens', usage?.total_tokens?.available ? compactNumber(usage.total_tokens.value) : '—'),
        metric('Est. cost', usage?.cost_usd?.available ? `$${Number(usage.cost_usd.value).toFixed(2)}` : '—'),
        metric('Throughput', `${throughput.toFixed(1)}/s`),
        metric('Elapsed', `${clock(elapsed)}/${clock(durationOf(detail))}`)
      );
      findingsEl.replaceChildren(...visibleFindings.map((finding) => {
        const node = document.createElement('div');
        node.className = 'finding';
        const code = document.createElement('strong');
        code.textContent = `${finding.kind}:${finding.code}`;
        const message = document.createElement('div');
        message.textContent = finding.message;
        node.append(code, message);
        return node;
      }));
      renderInspector(detail);
      renderWarningsDrawer(detail, visibleWarnings, visibleFindings);
      renderVisualView(detail);
      timelineEl.replaceChildren(...filteredEvents.map((event) => {
        const node = document.createElement('article');
        node.className = 'event';
        const top = document.createElement('div');
        top.className = 'event-top';
        const kind = document.createElement('strong');
        kind.textContent = event.kind;
        const eventId = document.createElement('code');
        eventId.textContent = event.event_id;
        top.append(kind, eventId);

        const meta = document.createElement('div');
        meta.className = 'muted';
        meta.append(
          `${event.timestamp} · actor `,
          code(text(event.actor.id)),
          ' · span ',
          code(event.span_id)
        );

        const operation = document.createElement('div');
        operation.textContent = `${text(event.operation.name)} · ${text(event.operation.status)}${event.uncertain ? ' · uncertain order' : ''}`;
        node.append(top, meta, operation);
        if (event.payload) {
          const payload = document.createElement('pre');
          payload.textContent = JSON.stringify(event.payload.preview, null, 2);
          node.append(payload);
        }
        node.addEventListener('click', () => {
          selectedEventId = event.event_id;
          selectedAgentId = event.actor.id;
          renderDetail(detail);
        });
        return node;
      }));
      if (!detail.events.length) {
        timelineEl.textContent = 'No events accepted for this run.';
      }
    }

    function renderVisualView(detail) {
      viewButtons.forEach((button) => {
        button.setAttribute('aria-current', button.dataset.view === selectedView ? 'true' : 'false');
      });
      timelineEl.hidden = selectedView !== 'timeline';
      stageEl.hidden = selectedView === 'timeline';
      if (selectedView === 'timeline') {
        stageEl.replaceChildren();
      } else if (selectedView === 'graph') {
        renderGraph(detail);
      } else if (selectedView === 'swimlane') {
        renderSwimlane(detail);
      } else if (selectedView === 'sequence') {
        renderSequence(detail);
      } else {
        renderTree(detail);
      }
      renderSelection(detail);
    }

    function renderGraph(detail) {
      const visibleAgents = visibleAgentsFor(detail);
      const positions = graphPositions(visibleAgents);
      renderCanvas(detail, visibleAgents, positions, linksAtHorizon(detail), limited(detail, visibleAgents));
    }

    function graphPositions(agents) {
      const positions = new Map();
      const stageWidth = Math.max(stageEl.clientWidth, 360);
      const stageHeight = Math.max(stageEl.clientHeight, 360);
      const centerX = stageWidth / 2 - 66;
      const centerY = stageHeight / 2 - 26;
      const maxRadius = Math.min(195, stageWidth * 0.34, stageHeight * 0.38);
      agents.forEach((agent, index) => {
        if (index === 0) {
          positions.set(agent.id, { x: centerX, y: centerY });
          return;
        }
        const progress = Math.sqrt(index / Math.max(agents.length - 1, 1));
        const radius = 42 + progress * maxRadius;
        const angle = index * 2.3999632297 - Math.PI / 2;
        positions.set(agent.id, {
          x: centerX + Math.cos(angle) * radius,
          y: centerY + Math.sin(angle) * radius,
        });
      });
      return positions;
    }

    function renderTree(detail) {
      const visibleAgents = visibleAgentsFor(detail);
      const byId = new Map(visibleAgents.map((agent) => [agent.id, agent]));
      const roots = visibleAgents.filter((agent) => !agent.parent_id || !byId.has(agent.parent_id));
      const levels = [];
      const visited = new Set();
      const queue = roots.map((agent) => ({ agent, depth: 0 }));
      while (queue.length) {
        const { agent, depth } = queue.shift();
        if (visited.has(agent.id)) continue;
        visited.add(agent.id);
        if (!levels[depth]) levels[depth] = [];
        levels[depth].push(agent);
        agent.child_ids.forEach((childId) => {
          if (byId.has(childId)) queue.push({ agent: byId.get(childId), depth: depth + 1 });
        });
      }
      const positions = new Map();
      levels.forEach((agents, depth) => agents.forEach((agent, index) => {
        positions.set(agent.id, { x: 90 + index * 220, y: 80 + depth * 170 });
      }));
      visibleAgents.forEach((agent, index) => {
        if (!positions.has(agent.id)) positions.set(agent.id, { x: 90 + index * 220, y: 80 + levels.length * 170 });
      });
      renderCanvas(
        detail,
        visibleAgents,
        positions,
        linksAtHorizon(detail).filter((link) => link.type === 'spawn'),
        limited(detail, visibleAgents)
      );
    }

    function renderSwimlane(detail) {
      const duration = Math.max(durationOf(detail), 1);
      const visibleEvents = filterEvents(eventsAtHorizon(detail));
      const rows = detail.actors.map((agent) => {
        const horizonAgent = agentsAtHorizon(detail).find((candidate) => candidate.id === agent.id);
        const row = document.createElement('div');
        row.className = 'lane';
        row.append(label('strong', '', `${agent.id} · ${horizonAgent ? horizonAgent.status : 'not started'}`));
        const track = document.createElement('div');
        track.className = 'lane-track';
        visibleEvents.filter((event) => event.actor.id === agent.id).forEach((event) => {
          const dot = document.createElement('span');
          dot.className = 'lane-event';
          dot.title = `${event.kind} ${event.offset_seconds.toFixed(1)}s`;
          dot.style.left = `${Math.min(96, Math.max(0, event.offset_seconds / duration * 100))}%`;
          track.append(dot);
        });
        const statuses = visibleEvents
          .filter((event) => event.actor.id === agent.id)
          .map((event) => `${event.offset_seconds.toFixed(1)}s ${event.operation.status}`)
          .join(' · ');
        row.append(track, label('div', 'agent-meta', statuses || 'no visible activity'));
        return row;
      });
      stageEl.replaceChildren(container('swimlane', rows));
    }

    function renderSequence(detail) {
      const visibleIds = new Set(filterEvents(eventsAtHorizon(detail)).map((event) => event.event_id));
      const rows = linksAtHorizon(detail)
        .filter((link) => link.type === 'message' && visibleIds.has(link.event_id))
        .map((link) => {
          const row = document.createElement('div');
          row.className = 'sequence-row';
          row.append(
            label('strong', '', link.source_actor_id),
            ` → ${text(link.target_actor_id || link.unresolved_target)} `,
            label('span', 'muted', link.unresolved_target ? 'unresolved target' : 'message.sent')
          );
          return row;
        });
      if (!rows.length) rows.push(label('div', 'sequence-row muted', 'No message.sent handoffs at this playback time.'));
      stageEl.replaceChildren(container('sequence-view', rows));
    }

    function renderCanvas(detail, agents, positions, links, dense) {
      const canvas = document.createElement('div');
      canvas.className = 'view-canvas';
      canvas.style.transform = `translate(${viewTransform.x}px, ${viewTransform.y}px) scale(${viewTransform.scale})`;
      const svg = document.createElementNS(svgNamespace, 'svg');
      svg.classList.add('edge-layer');
      links.forEach((link) => {
        const source = positions.get(link.source_actor_id);
        const target = positions.get(link.target_actor_id);
        if (!source || !target) return;
        const line = document.createElementNS(svgNamespace, 'line');
        line.setAttribute('x1', source.x + 21);
        line.setAttribute('y1', source.y + 22);
        line.setAttribute('x2', target.x + 21);
        line.setAttribute('y2', target.y + 22);
        line.setAttribute('stroke', link.type === 'message' ? '#ffc46b' : '#8bd3ff');
        line.setAttribute('stroke-width', link.type === 'spawn' ? '3' : '2');
        line.setAttribute('stroke-dasharray', link.type === 'message' ? '6 6' : '0');
        svg.append(line);
      });
      canvas.append(svg, ...agents.map((agent) => agentCard(detail, agent, positions.get(agent.id))));
      if (dense) {
        const note = document.createElement('div');
        note.className = 'dense-note';
        note.textContent = `Showing ${agents.length} of ${focusPool(detail).length} agents`;
        canvas.append(note);
      }
      stageEl.replaceChildren(canvas);
    }

    function visibleAgentsFor(detail) {
      return focusPool(detail).slice(0, visibleLimit);
    }

    function limited(detail, agents) {
      return agents.length < focusPool(detail).length;
    }

    function focusPool(detail) {
      const pool = filteredAgentsAtHorizon(detail);
      if (!focusedAgentId) return pool;
      const byId = new Map(pool.map((agent) => [agent.id, agent]));
      const included = new Set([focusedAgentId]);
      const visitChildren = (agentId) => {
        const agent = byId.get(agentId);
        if (!agent) return;
        agent.child_ids.forEach((childId) => {
          if (!included.has(childId)) {
            included.add(childId);
            visitChildren(childId);
          }
        });
      };
      visitChildren(focusedAgentId);
      return pool.filter((agent) => included.has(agent.id));
    }

    function agentCard(detail, agent, position) {
      const card = document.createElement('button');
      card.type = 'button';
      const hasStall = detail.warnings.some((warning) => warning.actor_id === agent.id && warning.code === 'STALL' && warning.active !== false);
      const visualStatus = hasStall ? 'stalled' : semanticStatus(agent.status);
      card.className = `agent-card status-${visualStatus}${String(agent.role).toLowerCase().includes('orchestrat') ? ' role-orchestrator' : ''}`;
      card.style.left = `${position.x}px`;
      card.style.top = `${position.y}px`;
      card.setAttribute('aria-current', agent.id === selectedAgentId ? 'true' : 'false');
      const visibleIds = new Set(eventsAtHorizon(detail).map((event) => event.event_id));
      const warningCount = detail.warnings.filter((warning) => (
        warning.actor_id === agent.id && (!warning.event_id || visibleIds.has(warning.event_id))
      )).length;
      const usage = agent.usage.total_tokens.available ? `${agent.usage.total_tokens.value} tokens` : 'usage unavailable';
      card.append(
        label('span', 'agent-id', agent.id),
        label('span', 'agent-meta', `${agent.status} · ${text(agent.role)} · ${text(agent.model)}`),
        label('span', 'agent-meta', `${usage}${warningCount ? ` · ${warningCount} warning(s)` : ''}`)
      );
      card.addEventListener('click', () => {
        selectedAgentId = agent.id;
        selectedEventId = null;
        renderDetail(detail);
      });
      return card;
    }

    function renderSelection(detail) {
      const agent = agentsAtHorizon(detail).find((candidate) => candidate.id === selectedAgentId);
      if (!agent) {
        selectionEl.textContent = 'Select an agent to inspect graph context.';
        return;
      }
      const usage = agent.usage.total_tokens.available ? `${agent.usage.total_tokens.value} tokens` : 'usage unavailable';
      const focusText = focusedAgentId === agent.id ? ' Focused subtree.' : '';
      selectionEl.textContent = `Selected ${agent.id}: ${agent.status}, role ${text(agent.role)}, model ${text(agent.model)}, parent ${text(agent.parent_id)}, ${usage}.${focusText}`;
    }

    function handleViewAction(action) {
      if (action === 'zoom-in') viewTransform.scale = Math.min(2.5, viewTransform.scale + 0.15);
      if (action === 'zoom-out') viewTransform.scale = Math.max(0.45, viewTransform.scale - 0.15);
      if (action === 'pan-left') viewTransform.x -= 60;
      if (action === 'pan-right') viewTransform.x += 60;
      if (action === 'pan-up') viewTransform.y -= 60;
      if (action === 'pan-down') viewTransform.y += 60;
      if (action === 'show-more') visibleLimit += 80;
      if (action === 'warnings') warningsOpen = !warningsOpen;
      if (action === 'reset') {
        viewTransform = { scale: 1, x: 0, y: 0 };
        focusedAgentId = null;
        visibleLimit = initialVisibleLimit();
      }
      if (action === 'focus' && currentDetail?.actors.length) {
        selectedAgentId = selectedAgentId || currentDetail.actors[0].id;
        focusedAgentId = selectedAgentId;
        visibleLimit = initialVisibleLimit();
        viewTransform = { scale: 1.15, x: 40, y: 20 };
      }
      renderDetail(currentDetail);
    }

    function renderInspector(detail) {
      const event = detail.events.find((candidate) => candidate.event_id === selectedEventId);
      const agent = filteredAgentsAtHorizon(detail).find((candidate) => candidate.id === selectedAgentId)
        || agentsAtHorizon(detail).find((candidate) => candidate.id === selectedAgentId);
      if (event) {
        const payloadPreview = event.payload ? JSON.stringify(event.payload.preview) : 'none';
        inspectorEl.replaceChildren(
          label('h2', '', 'Event inspector'),
          definitionList({
            event_id: event.event_id,
            trace_id: event.trace_id,
            span_id: event.span_id,
            parent_span_id: event.parent_span_id,
            emitter_id: event.emitter_id,
            sequence: event.sequence,
            actor: event.actor.id,
            kind: event.kind,
            operation_name: text(event.operation.name),
            status: event.operation.status,
            timestamp: event.timestamp,
            usage: JSON.stringify(event.usage),
            attributes: JSON.stringify(event.attributes || {}),
            payload_preview: payloadPreview,
          }),
          payloadButton(detail.run.trace_id, event.event_id)
        );
        return;
      }
      if (agent) {
        const relatedEvents = detail.events.filter((eventItem) => eventItem.actor.id === agent.id);
        const warningDetails = detail.warnings.filter((warning) => warning.actor_id === agent.id);
        const header = document.createElement('div');
        header.className = 'inspector-header';
        const avatar = label('div', 'inspector-avatar', agent.id.slice(0, 2).toUpperCase());
        const title = document.createElement('div');
        title.className = 'inspector-title';
        title.append(label('h2', '', 'Agent inspector'), label('strong', '', agent.id), label('span', '', `${text(agent.role)} · ${text(agent.model)}`));
        header.append(avatar, title, label('span', 'status-pill', agent.status));
        const usage = document.createElement('div');
        usage.className = 'usage-grid';
        usage.append(
          usageCard('INPUT TOK', agent.usage.input_tokens),
          usageCard('OUTPUT TOK', agent.usage.output_tokens),
          usageCard('COST', agent.usage.cost_usd, '$')
        );
        const relationships = inspectorBlock('ORCHESTRATION');
        const parentRow = label('div', 'relationship-row', `parent · ${text(agent.parent_id)}`);
        relationships.append(parentRow);
        if (agent.parent_id) parentRow.addEventListener('click', () => selectAgent(detail, agent.parent_id));
        (agent.child_ids || []).forEach((childId) => {
          const child = label('button', 'relationship-row', `child · ${childId}`);
          child.type = 'button';
          child.addEventListener('click', () => selectAgent(detail, childId));
          relationships.append(child);
        });
        const warnings = inspectorBlock('⚠ WARNINGS');
        if (!warningDetails.length) warnings.append(label('div', 'muted', 'No warnings for this agent.'));
        warningDetails.forEach((warning) => warnings.append(label('div', 'drawer-item', `${warning.code} · ${warning.summary}`)));
        const timeline = inspectorBlock(`EVENT TIMELINE · ${relatedEvents.length}`);
        timeline.dataset.field = 'related_events';
        relatedEvents.forEach((eventItem) => {
          const row = label('button', 'inspector-event', `${eventItem.kind} · ${text(eventItem.operation.name)} · ${eventItem.operation.status}`);
          row.type = 'button';
          row.addEventListener('click', () => {
            selectedEventId = eventItem.event_id;
            renderDetail(detail);
          });
          timeline.append(row);
        });
        inspectorEl.replaceChildren(
          header,
          inspectorBlock('USAGE', usage),
          relationships,
          warnings,
          timeline
        );
        return;
      }
      const usage = detail.usage || detail.run.usage;
      inspectorEl.replaceChildren(
        label('h2', '', 'RUN OVERVIEW'),
        label('p', 'muted', `${detail.run.trace_id} — a causal view of this agent run. Select any agent in the stage to inspect its usage, relationships, events, and warnings.`),
        definitionList({
          trace: detail.run.trace_id,
          state: detail.run.state,
          agents: detail.run.actor_count,
          events: detail.run.event_count,
          duration: `${detail.run.duration_seconds || 0}s`,
          tokens: usage?.total_tokens?.available ? usage.total_tokens.value : 'unavailable',
          estimated_cost: usage?.cost_usd?.available ? `$${usage.cost_usd.value}` : 'unavailable',
          warnings: detail.run.warning_count,
          source: detail.source.state,
        })
      );
    }

    function renderWarningsDrawer(detail, warnings, findings) {
      warningsDrawerEl.hidden = !warningsOpen;
      warningsBackdropEl.hidden = !warningsOpen;
      [document.querySelector('header.topbar'), metricsEl, document.querySelector('.stage-shell'), document.querySelector('.inspector-shell')]
        .forEach((element) => { element.inert = warningsOpen; });
      if (!warningsOpen) return;
      const items = [
        ...warnings.map((warning) => ({
          kind: warning.category || 'runtime',
          code: warning.code,
          message: warning.summary,
          event_id: warning.event_id,
          actor_id: warning.actor_id,
          active: warning.active !== false,
          trigger_time: eventTime(detail, warning.event_id),
          detected_at: warning.detected_at || 'unavailable',
          resolved_at: warning.resolved_at || 'unavailable',
        })),
        ...findings.map((finding) => ({
          kind: finding.kind,
          code: finding.code,
          message: finding.message,
          event_id: finding.event_id,
          actor_id: null,
          active: false,
          trigger_time: eventTime(detail, finding.event_id),
          detected_at: finding.detected_at || 'unavailable',
          resolved_at: 'unavailable',
        })),
      ];
      const head = document.createElement('div');
      head.className = 'drawer-head';
      const close = document.createElement('button');
      close.type = 'button';
      close.setAttribute('aria-label', 'Close warnings');
      close.textContent = '✕';
      close.addEventListener('click', () => {
        warningsOpen = false;
        renderDetail(detail);
      });
      head.append(label('h2', '', 'Warnings and findings'), close);
      warningsDrawerEl.replaceChildren(
        head,
        ...items.map((item) => {
          const node = document.createElement('button');
          node.type = 'button';
          node.className = 'drawer-item';
          node.textContent = `${item.kind}:${item.code} ${item.active ? 'active' : 'resolved'} event ${text(item.event_id)} trigger ${text(item.trigger_time)} detected ${text(item.detected_at)} resolved ${text(item.resolved_at)} ${item.message}`;
          node.addEventListener('click', () => {
            selectedEventId = item.event_id || null;
            selectedAgentId = item.actor_id || selectedAgentId;
            warningsOpen = false;
            renderDetail(detail);
          });
          return node;
        })
      );
      close.focus();
    }

    function eventTime(detail, eventId) {
      return detail.events.find((event) => event.event_id === eventId)?.timestamp || 'unavailable';
    }

    function definitionList(values) {
      const list = document.createElement('dl');
      Object.entries(values).forEach(([key, value]) => {
        list.append(label('dt', '', key), label('dd', '', text(value)));
      });
      return list;
    }

    function inspectorBlock(title, content) {
      const block = document.createElement('div');
      block.className = 'inspector-block';
      block.append(label('div', 'inspector-label', title));
      if (content) block.append(content);
      return block;
    }

    function usageCard(title, usage, prefix = '') {
      const card = document.createElement('div');
      card.className = 'usage-card';
      const value = usage?.available ? `${prefix}${compactNumber(usage.value)}` : '—';
      card.append(label('span', '', title), label('strong', '', value));
      return card;
    }

    function selectAgent(detail, actorId) {
      selectedAgentId = actorId;
      selectedEventId = null;
      renderDetail(detail);
    }

    function payloadButton(traceId, eventId) {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = 'Load retained payload';
      button.addEventListener('click', async () => {
        const payload = await fetchJson(`/api/v1/runs/${encodeURIComponent(traceId)}/events/${encodeURIComponent(eventId)}/payload`);
        const pre = document.createElement('pre');
        pre.textContent = JSON.stringify(payload.payload, null, 2);
        inspectorEl.append(pre);
      });
      return button;
    }

    function filterEvents(events) {
      const search = searchEl.value.trim().toLowerCase();
      const actor = actorFilterEl.value.trim().toLowerCase();
      const kind = kindFilterEl.value.trim().toLowerCase();
      return events.filter((event) => {
        const encoded = JSON.stringify(event).toLowerCase();
        return (!search || encoded.includes(search))
          && (!actor || event.actor.id.toLowerCase().includes(actor))
          && (!kind || event.kind.toLowerCase().includes(kind));
      });
    }

    function syncPlayback(detail) {
      const duration = durationOf(detail);
      const terminal = detail.run.state === 'completed' || detail.run.state === 'failed';
      if (playbackTraceId !== detail.run.trace_id) {
        playbackTraceId = detail.run.trace_id;
        playbackTime = duration;
        liveFollow = !terminal;
        playing = false;
      }
      if (liveFollow) playbackTime = duration;
      playbackTime = Math.min(Math.max(playbackTime, 0), duration);
      scrubberEl.max = String(duration);
      scrubberEl.value = String(playbackTime);
      playbackToggleEl.textContent = playing ? '■' : '▶';
      playbackToggleEl.setAttribute('aria-label', playing ? 'Pause' : 'Play');
      playbackClockEl.textContent = `${clock(playbackTime)} / ${clock(duration)}`;
      playbackModeEl.textContent = liveFollow ? 'streaming' : playing ? `${playbackSpeed}× replay` : 'paused history';
      jumpLiveEl.hidden = liveFollow;
    }

    function durationOf(detail) {
      return Math.max(0, detail?.duration_seconds || detail?.run?.duration_seconds || 0);
    }

    function clock(seconds) {
      const safe = Math.max(0, Math.floor(Number(seconds) || 0));
      return `${String(Math.floor(safe / 60)).padStart(2, '0')}:${String(safe % 60).padStart(2, '0')}`;
    }

    function compactNumber(value) {
      const number = Number(value) || 0;
      if (number >= 1000000) return `${(number / 1000000).toFixed(1)}m`;
      if (number >= 1000) return `${(number / 1000).toFixed(1)}k`;
      return String(number);
    }

    function initialVisibleLimit() {
      return window.innerWidth <= 720 ? 8 : 12;
    }

    function eventsAtHorizon(detail) {
      return detail.events.filter((event) => event.offset_seconds <= playbackTime + 0.0001);
    }

    function linksAtHorizon(detail) {
      const visibleIds = new Set(filterEvents(eventsAtHorizon(detail)).map((event) => event.event_id));
      return detail.links.filter((link) => !link.event_id || visibleIds.has(link.event_id));
    }

    function agentsAtHorizon(detail) {
      const byId = new Map(detail.actors.map((agent) => [agent.id, agent]));
      const lastEvent = new Map();
      const visibleEvents = eventsAtHorizon(detail);
      visibleEvents.forEach((event) => lastEvent.set(event.actor.id, event));
      return [...lastEvent.keys()].map((actorId) => {
        const agent = byId.get(actorId) || { id: actorId, child_ids: [] };
        const event = lastEvent.get(actorId);
        const actorEvents = visibleEvents.filter((visibleEvent) => visibleEvent.actor.id === actorId);
        return {
          ...agent,
          status: actorStatus(actorEvents, agent.status),
          operation: event.operation.name || agent.operation,
          usage: usageFor(actorEvents),
        };
      });
    }

    function actorStatus(events, fallback) {
      const lifecycle = [...events].reverse().find((event) => event.kind.startsWith('agent.') || event.kind.startsWith('trace.'));
      if (lifecycle) {
        if (lifecycle.kind.endsWith('.failed')) return 'failed';
        if (lifecycle.kind.endsWith('.completed')) return 'done';
      }
      if (events.some((event) => event.operation.status === 'waiting')) return 'waiting';
      const normalized = semanticStatus(fallback);
      return ['done', 'failed'].includes(normalized) && playbackTime >= durationOf(currentDetail) ? normalized : 'running';
    }

    function semanticStatus(status) {
      const value = String(status || '').toLowerCase();
      if (['completed', 'complete', 'done', 'success', 'succeeded'].includes(value)) return 'done';
      if (['failed', 'error', 'errored'].includes(value)) return 'failed';
      if (value === 'waiting') return 'waiting';
      return 'running';
    }

    function isRequestStart(event) {
      return event.kind === 'model.request' || event.kind === 'model.request.started'
        || event.kind === 'tool.call.started';
    }

    function filteredAgentsAtHorizon(detail) {
      const ids = new Set(filterEvents(eventsAtHorizon(detail)).map((event) => event.actor.id));
      return agentsAtHorizon(detail).filter((agent) => ids.has(agent.id));
    }

    function usageFor(events) {
      const fields = ['input_tokens', 'output_tokens', 'total_tokens', 'cost_usd'];
      const result = Object.fromEntries(fields.map((field) => [field, { available: false, value: null }]));
      events.forEach((event) => fields.forEach((field) => {
        const usage = event.usage[field];
        if (usage.available) {
          result[field].available = true;
          result[field].value = (result[field].value || 0) + usage.value;
        }
      }));
      return result;
    }

    function setPlaying(next) {
      playing = next;
      if (playing) liveFollow = false;
      startPlaybackTimer();
      renderDetail(currentDetail);
    }

    function startPlaybackTimer() {
      if (playbackTimer) window.clearInterval(playbackTimer);
      playbackTimer = null;
      if (!playing) return;
      playbackTimer = window.setInterval(() => {
        playbackTime = Math.min(durationOf(currentDetail), playbackTime + 0.25 * playbackSpeed);
        if (playbackTime >= durationOf(currentDetail)) setPlaying(false);
        else renderDetail(currentDetail);
      }, 250);
    }

    function metric(label, value) {
      const node = document.createElement('div');
      node.className = 'metric';
      const number = document.createElement('strong');
      number.textContent = value;
      const caption = document.createElement('span');
      caption.textContent = label;
      node.append(number, caption);
      return node;
    }

    function code(value) {
      const node = document.createElement('code');
      node.textContent = value;
      return node;
    }

    function label(tag, className, value) {
      const node = document.createElement(tag);
      node.className = className;
      node.textContent = value;
      return node;
    }

    function container(className, children) {
      const node = document.createElement('div');
      node.className = className;
      node.replaceChildren(...children);
      return node;
    }

    function apiPath(path) {
      if (!accessToken) return path;
      const separator = path.includes('?') ? '&' : '?';
      return `${path}${separator}token=${encodeURIComponent(accessToken)}`;
    }

    async function init() {
      try {
        const data = await fetchJson('/api/v1/runs');
        renderRuns(data);
        if (selectedTraceId) await selectRun(selectedTraceId);
        else statusEl.textContent = 'No accepted runs';
        connectEvents();
      } catch (error) {
        statusEl.textContent = `Failed to load: ${error.message}`;
        statusEl.className = 'source-status warning';
      }
    }

    function connectEvents() {
      if (events) events.close();
      events = new EventSource(apiPath(`/api/v1/events?cursor=${cursor}`));
      const refresh = () => init();
      events.addEventListener('event', refresh);
      events.addEventListener('finding', refresh);
      events.addEventListener('source', refresh);
      events.addEventListener('heartbeat', refresh);
      events.onerror = () => {
        events.close();
        events = null;
        setTimeout(init, 1000);
      };
    }

    init();
  </script>
</body>
</html>
